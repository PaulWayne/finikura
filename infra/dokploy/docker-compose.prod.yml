# Fini Kura production stack for Dokploy (Docker Compose service, built from this repo).
# - No published ports: Traefik (Dokploy) routes by domain over the external "dokploy-network".
# - Every name is prefixed "finikura-" to avoid clashing with the other sites on the VPS.
# - Secrets and URLs come from the Dokploy "Environment" tab (see infra/dokploy/.env.example).
#   DOMAIN=fini-kura.fr  ->  front: DOMAIN, Medusa: api.DOMAIN, Strapi: cms.DOMAIN, Umami: stats.DOMAIN, media: media.DOMAIN

name: finikura

services:
  postgres:
    image: postgres:16-alpine
    container_name: finikura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    volumes:
      - finikura-pgdata:/var/lib/postgresql/data
      - ../postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d medusa"]
      interval: 10s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: finikura-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - finikura-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    networks: [internal]

  medusa:
    build: { context: ../.., target: medusa }
    container_name: finikura-medusa
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Internal Docker network: no TLS. Without ssl_mode=disable Medusa forces SSL on any non-localhost host.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medusa?ssl_mode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: https://${DOMAIN}
      ADMIN_CORS: https://api.${DOMAIN}
      AUTH_CORS: https://api.${DOMAIN},https://${DOMAIN}
      JWT_SECRET: ${MEDUSA_JWT_SECRET}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${MEDUSA_AUTH_MFA_ENCRYPTION_KEY}
      STOREFRONT_REVALIDATE_URL: http://storefront:3100/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      MEDUSA_ADMIN_URL: https://api.${DOMAIN}/app
      # Media storage (Garage): uploads over the internal S3 API, public reads from media.DOMAIN.
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_URL: https://media.${DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start: migrations run before Medusa listens.
      start_period: 300s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # The site talks to Medusa over the internal network: the public domain only serves the admin.
      # /store (the shop API) and /auth/customer (customer accounts, unused) are left out (audit S3).
      - traefik.http.routers.finikura-medusa.rule=Host(`api.${DOMAIN}`) && !PathPrefix(`/store`) && !PathPrefix(`/auth/customer`) && !PathPrefix(`/auth/user`)
      - traefik.http.routers.finikura-medusa.entrypoints=websecure
      - traefik.http.routers.finikura-medusa.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-medusa.middlewares=finikura-secure
      # Admin sign-in: at most 10 tries a minute per address (audit S2).
      - traefik.http.routers.finikura-medusa-auth.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/auth/user`)
      - traefik.http.routers.finikura-medusa-auth.entrypoints=websecure
      - traefik.http.routers.finikura-medusa-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-medusa-auth.middlewares=finikura-secure,finikura-auth-limit
      - traefik.http.routers.finikura-medusa-auth.service=finikura-medusa
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.average=10
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.burst=5
      - traefik.http.routers.finikura-medusa-http.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.finikura-medusa-http.entrypoints=web
      - traefik.http.routers.finikura-medusa-http.middlewares=finikura-https
      # Same definitions on every routed service: no router depends on another container being up.
      - traefik.http.middlewares.finikura-https.redirectscheme.scheme=https
      - traefik.http.middlewares.finikura-https.redirectscheme.permanent=true
      - traefik.http.middlewares.finikura-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.finikura-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.finikura-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.finikura-secure.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.services.finikura-medusa.loadbalancer.server.port=9000
    networks: [internal, dokploy-network]

  strapi:
    build: { context: ../.., target: strapi }
    container_name: finikura-strapi
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://cms.${DOMAIN}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      STOREFRONT_REVALIDATE_URL: http://storefront:3100/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Media storage (Garage): uploads over the internal S3 API, public reads from media.DOMAIN.
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_URL: https://media.${DOMAIN}
    volumes:
      - finikura-strapi-uploads:/app/apps/strapi/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.finikura-strapi.rule=Host(`cms.${DOMAIN}`)
      - traefik.http.routers.finikura-strapi.entrypoints=websecure
      - traefik.http.routers.finikura-strapi.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-strapi.middlewares=finikura-secure
      # Admin sign-in and password reset: at most 10 tries a minute per address (audit S2), on top
      # of Strapi's own limit.
      - traefik.http.routers.finikura-strapi-auth.rule=Host(`cms.${DOMAIN}`) && Method(`POST`) && (PathPrefix(`/admin/login`) || PathPrefix(`/admin/forgot-password`) || PathPrefix(`/admin/reset-password`) || PathPrefix(`/admin/register`))
      - traefik.http.routers.finikura-strapi-auth.entrypoints=websecure
      - traefik.http.routers.finikura-strapi-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-strapi-auth.middlewares=finikura-secure,finikura-auth-limit
      - traefik.http.routers.finikura-strapi-auth.service=finikura-strapi
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.average=10
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.finikura-auth-limit.ratelimit.burst=5
      - traefik.http.routers.finikura-strapi-http.rule=Host(`cms.${DOMAIN}`)
      - traefik.http.routers.finikura-strapi-http.entrypoints=web
      - traefik.http.routers.finikura-strapi-http.middlewares=finikura-https
      # Same definitions on every routed service: no router depends on another container being up.
      - traefik.http.middlewares.finikura-https.redirectscheme.scheme=https
      - traefik.http.middlewares.finikura-https.redirectscheme.permanent=true
      - traefik.http.middlewares.finikura-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.finikura-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.finikura-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.finikura-secure.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.services.finikura-strapi.loadbalancer.server.port=1337
    networks: [internal, dokploy-network]

  storefront:
    build: { context: ../.., target: storefront }
    container_name: finikura-storefront
    restart: unless-stopped
    depends_on:
      medusa: { condition: service_healthy }
      strapi: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      COMMERCE_SOURCE: live
      CONTENT_SOURCE: live
      MEDUSA_BACKEND_URL: http://medusa:9000
      MEDUSA_PUBLIC_URL: https://api.${DOMAIN}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: https://cms.${DOMAIN}
      STRAPI_TOKEN: ${STRAPI_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Visit statistics (FK-10): no script while UMAMI_WEBSITE_ID is empty.
      UMAMI_SCRIPT_URL: https://stats.${DOMAIN}/script.js
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      SITE_URL: https://${DOMAIN}
      MEDIA_PUBLIC_URL: https://media.${DOMAIN}
      # Orders allowed in a row (audit B2); empty = the defaults of docs/deploiement.md.
      ORDER_LIMIT_PHONE_15MIN: ${ORDER_LIMIT_PHONE_15MIN:-}
      ORDER_LIMIT_PHONE_DAY: ${ORDER_LIMIT_PHONE_DAY:-}
      ORDER_LIMIT_IP_15MIN: ${ORDER_LIMIT_IP_15MIN:-}
      ORDER_LIMIT_IP_DAY: ${ORDER_LIMIT_IP_DAY:-}
      # These counts are kept in Redis: they survive a restart or a redeploy of the site (audit S7).
      ORDER_LIMIT_REDIS_URL: redis://redis:6379
      # 1 = rebuild the site at the next restart of its container (otherwise only a redeploy does).
      FORCE_REBUILD: ${FORCE_REBUILD:-}
      # IndexNow: Bing (ChatGPT, Copilot) told when pages change; empty = off.
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Preview before the opening: 1 = hidden from search engines and AI crawlers; empty = indexable.
      NOINDEX: ${NOINDEX:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start builds the site (1 to 3 minutes).
      start_period: 300s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.finikura-front.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.finikura-front.entrypoints=websecure
      - traefik.http.routers.finikura-front.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-front.middlewares=finikura-secure,finikura-front-inflight,finikura-front-limit
      # Requests per address (audit S6). A page is about 40 requests, and in Mali hundreds of phones
      # of one mobile network share an address: during a TikTok live, a crowd arrives at once behind
      # a few addresses. The limits are a safety valve against one runaway script, set far above
      # that crowd: 400 requests a second on average, 3000 in a burst, 400 at the same time.
      - traefik.http.middlewares.finikura-front-limit.ratelimit.average=${FRONT_LIMIT_PER_SECOND:-400}
      - traefik.http.middlewares.finikura-front-limit.ratelimit.period=1s
      - traefik.http.middlewares.finikura-front-limit.ratelimit.burst=${FRONT_LIMIT_BURST:-3000}
      - traefik.http.middlewares.finikura-front-inflight.inflightreq.amount=${FRONT_LIMIT_IN_FLIGHT:-400}
      # What changes something (cart, order: every POST) is counted apart: 600 a minute per address,
      # 300 in a burst. Room for a live's crowd behind one address, not for a script filling
      # Medusa with carts all day.
      - traefik.http.routers.finikura-front-post.rule=Host(`${DOMAIN}`) && Method(`POST`)
      - traefik.http.routers.finikura-front-post.entrypoints=websecure
      - traefik.http.routers.finikura-front-post.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-front-post.middlewares=finikura-secure,finikura-front-post-limit
      - traefik.http.routers.finikura-front-post.service=finikura-front
      - traefik.http.middlewares.finikura-front-post-limit.ratelimit.average=${FRONT_LIMIT_POST_PER_MINUTE:-600}
      - traefik.http.middlewares.finikura-front-post-limit.ratelimit.period=1m
      - traefik.http.middlewares.finikura-front-post-limit.ratelimit.burst=${FRONT_LIMIT_POST_BURST:-300}
      - traefik.http.routers.finikura-front-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.finikura-front-http.entrypoints=web
      - traefik.http.routers.finikura-front-http.middlewares=finikura-https
      # www.DOMAIN goes to DOMAIN, in one hop, with its own certificate.
      - traefik.http.routers.finikura-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.finikura-www.entrypoints=websecure
      - traefik.http.routers.finikura-www.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-www.middlewares=finikura-www
      - traefik.http.routers.finikura-www-http.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.finikura-www-http.entrypoints=web
      - traefik.http.routers.finikura-www-http.middlewares=finikura-www
      - traefik.http.middlewares.finikura-www.redirectregex.regex=^https?://www\.(.+)
      - traefik.http.middlewares.finikura-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.finikura-www.redirectregex.permanent=true
      - traefik.http.middlewares.finikura-https.redirectscheme.scheme=https
      - traefik.http.middlewares.finikura-https.redirectscheme.permanent=true
      # Repeated on every routed service, so that the admins and the photos keep answering while this
      # container rebuilds. Audit S1: HSTS for one year on the domain and its
      # subdomains, no MIME sniffing, and no X-Powered-By (Medusa announces Express).
      - traefik.http.middlewares.finikura-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.finikura-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.finikura-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.finikura-secure.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.services.finikura-front.loadbalancer.server.port=3100
    networks: [internal, dokploy-network]

  # Media storage (FK-15): S3-compatible, one node. Only the public website endpoint (port 3902) is
  # routed, as media.DOMAIN; the S3 API stays on the internal network. Setup: infra/garage/init.sh
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: finikura-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - finikura-garage:/var/lib/garage
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.finikura-media.rule=Host(`media.${DOMAIN}`)
      - traefik.http.routers.finikura-media.entrypoints=websecure
      - traefik.http.routers.finikura-media.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-media.middlewares=finikura-secure
      - traefik.http.routers.finikura-media-http.rule=Host(`media.${DOMAIN}`)
      - traefik.http.routers.finikura-media-http.entrypoints=web
      - traefik.http.routers.finikura-media-http.middlewares=finikura-https
      # Same definitions on every routed service: no router depends on another container being up.
      - traefik.http.middlewares.finikura-https.redirectscheme.scheme=https
      - traefik.http.middlewares.finikura-https.redirectscheme.permanent=true
      - traefik.http.middlewares.finikura-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.finikura-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.finikura-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.finikura-secure.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.services.finikura-media.loadbalancer.server.port=3902
    networks: [internal, dokploy-network]

  # Visit statistics (FK-10): cookieless, its own "umami" database in the shared PostgreSQL.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: finikura-umami
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.finikura-umami.rule=Host(`stats.${DOMAIN}`)
      - traefik.http.routers.finikura-umami.entrypoints=websecure
      - traefik.http.routers.finikura-umami.tls.certresolver=letsencrypt
      - traefik.http.routers.finikura-umami.middlewares=finikura-secure
      - traefik.http.routers.finikura-umami-http.rule=Host(`stats.${DOMAIN}`)
      - traefik.http.routers.finikura-umami-http.entrypoints=web
      - traefik.http.routers.finikura-umami-http.middlewares=finikura-https
      # Same definitions on every routed service: no router depends on another container being up.
      - traefik.http.middlewares.finikura-https.redirectscheme.scheme=https
      - traefik.http.middlewares.finikura-https.redirectscheme.permanent=true
      - traefik.http.middlewares.finikura-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.finikura-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.finikura-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.finikura-secure.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.services.finikura-umami.loadbalancer.server.port=3000
    networks: [internal, dokploy-network]

volumes:
  finikura-pgdata:
  finikura-redis:
  finikura-strapi-uploads:
  finikura-garage:

networks:
  internal:
    name: finikura-internal
  dokploy-network:
    external: true
