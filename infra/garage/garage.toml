# Garage (S3-compatible object storage) for Fini Kura media: one node, no replication.
# Secrets come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

# S3 API (internal only in production): used by Medusa and Strapi to upload.
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# Public read: the "media" bucket is served as a website, chosen by the Host header
# (alias "localhost" in development, "media.<domain>" in production).
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.internal"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
