packages:
  - "apps/*"
allowBuilds:
  sharp: true
  unrs-resolver: true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  "@medusajs/telemetry": false
  core-js-pure: false
# Security fixes inside Strapi's own dependencies (audit S6), same major version as what Strapi asks for.
# To drop once a Strapi release ships them.
overrides:
  "nodemailer@>=10 <10.1.4": "10.3.1"
  "zod@>=4 <4.6.6": "4.6.7"
