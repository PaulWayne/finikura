# FK-28: checks on every push and pull request (Forgejo Actions).
# Runner set up as in docs/ci-forgejo.md: label "docker", host network, Docker socket mounted,
# one job at a time. The jobs below therefore run one after the other on the VPS.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, tests unitaires
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter medusa test:unit

  medusa:
    name: Tests Medusa (PostgreSQL jetable)
    needs: checks
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Client Docker
        run: apt-get update -qq && apt-get install -y -qq docker.io >/dev/null
      - name: Dépendances
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # The script publishes PostgreSQL on 127.0.0.1 of the host: the runner's host network
      # makes it reachable from this job container.
      - run: pnpm --filter medusa test:integration:ci

  e2e:
    name: Parcours e2e (mode mock)
    needs: checks
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter storefront exec playwright install-deps chromium
      - run: pnpm --filter storefront test:e2e
