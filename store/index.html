<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (_) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('Cannot set property fetch') !== -1 || (e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
